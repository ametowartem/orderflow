syntax = "proto3";
package payment.v1;
option go_package = "github.com/ametowartem/orderflow/proto/payment/v1;paymentv1";

service PaymentService {
    rpc InitiatePayment(InitiatePaymentRequest) returns (InitiatePaymentResponse);
}

message InitiatePaymentRequest {
    string order_id = 1;
    double amount = 2;
}

message InitiatePaymentResponse {
    string payment_id = 1;
    string status = 2;
}