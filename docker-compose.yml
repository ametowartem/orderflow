services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
      - orders_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - orderflow
  order-service:
    build:
      dockerfile: ./Dockerfile
      context: ./services/orders-service
    ports:
      - "8080:8080"
    environment:
      INVENTORY_SERVICE_ADDR: "inventory-service:50051"
    networks:
      - orderflow
    depends_on:
      - postgres
  inventory-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - orderflow
      
  inventory-service:
    build:
      dockerfile: ./Dockerfile
      context: ./services/inventory-service
    ports:
      - "50051:50051"
    networks:
      - orderflow
    depends_on:
      - inventory-postgres

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    networks:
      - orderflow




volumes:
  orders_pgdata:
  inventory_pgdata:
networks:
  orderflow:
    name: orderflow
