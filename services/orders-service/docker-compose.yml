services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
      - orders_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - orderflow
  order-service:
    build:
      dockerfile: ./Dockerfile
      context: .
    ports:
      - "8080:8080"
    environment:
      INVENTORY_SERVICE_ADDR: "inventory-service:50051"
    networks:
      - orderflow
    depends_on:
      - postgres


volumes:
  orders_pgdata:
networks:
  orderflow:
    name: orderflow
