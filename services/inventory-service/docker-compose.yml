services:
  inventory-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_pass
      POSTGRES_DB: inventory_db
    ports:
      - "5433:5432"
    volumes:
      - inventory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - orderflow
      
  inventory-service:
    build: 
      dockerfile: ./Dockerfile
      context: .
    ports:
      - "50051:50051"
    networks:
      - orderflow
    depends_on:
      - inventory-postgres


volumes:
  inventory_pgdata:
networks:
  orderflow:
    name: orderflow